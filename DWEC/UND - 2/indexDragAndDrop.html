<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .cajaRoja {
        width: 100px;
        height: 100px;
        background-color: red;
        cursor: grab;
    }

    .cajaAzul {
        width: 100px;
        height: 100px;
        background-color: blue;
        cursor: grab;
    }

    .contenedor {
        min-width: 200px;
        max-width: 400px;
        min-height: 200px;
        border: 2px solid black;
        border-radius: 5px;
        padding: 20px;
        margin-top: 20px;
    }
</style>
</head>
<body>
    <div class="cajaRoja" draggable="true"></div>
    <div class="cajaAzul" draggable="true"></div>
    <div class="contenedor" ></div>


    <script src="10.DragAndDrop.js"></script>
</body>
</html>
