<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* RESET GENERAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* BODY */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        /* CONTENEDOR */
        body>div {
            width: 100%;
            max-width: 450px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* FORMULARIO */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* LABELS */
        label {
            color: #243b55;
            font-size: 15px;
            font-weight: 700;
            margin-top: 8px;
        }

        /* INPUTS */
        input:not([type="submit"]) {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e5ec;
            border-radius: 10px;
            background-color: #f8fafc;
            color: #243b55;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        /* PLACEHOLDER / FOCUS */
        input:not([type="submit"]):focus {
            border-color: #4776e6;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(71, 118, 230, 0.12);
        }

        /* BOTÓN */
        input[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4776e6, #3154b8);
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* HOVER BOTÓN */
        input[type="submit"]:hover {
            background: linear-gradient(135deg, #3154b8, #243b8a);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(49, 84, 184, 0.35);
        }

        /* ACTIVE BOTÓN */
        input[type="submit"]:active {
            transform: scale(0.98);
        }

        .error {
            color: red;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            body>div {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
    <div>
        <form method="post" action="https://formsubmit.co/jfueser322@g.educaand.es">
            <label for="" idPassword>Contraseña: </label>
            <input type="password" id="idPassword" name="nPassword" minlength="4" maxlength="8" required>
            <br>

            <label for="idTexto">Texto:</label>
            <input type="text" id="idTexto" name="nTexto" required>

            <br>

            <label for="idEmail">Email:</label>
            <input type="email" id="idEmail" name="nEmail" required>

            <br>
            <input type="submit" id="idBtnEnviar">
        </form>
    </div>
</body>

</html>
